<!-- FarmConsilium calculator fragment — paste into html_code -->
<div class="fc-calc" data-calculator="SLUG">
  <style>
/* FC-CALC-STYLES — from shared/fc-calc.css; sync: node scripts/sync-calculator-styles.mjs SLUG */
STYLES
  </style>

  <div class="fc-calc__card">
    <h2 class="fc-calc__title">Название калькулятора</h2>
    <p class="fc-calc__hint">Краткое описание показаний</p>

    <form class="fc-calc__form" id="fc-calc-SLUG-form" novalidate>
      <div class="fc-calc__field">
        <label for="fc-calc-SLUG-example">Пример поля (ед.)</label>
        <input type="number" id="fc-calc-SLUG-example" name="example" inputmode="decimal" min="0" step="any" required />
        <span class="fc-calc__error" id="fc-calc-SLUG-example-error" role="alert"></span>
      </div>

      <button type="submit" class="fc-calc__btn">Рассчитать</button>
    </form>

    <div class="fc-calc__result" id="fc-calc-SLUG-result" hidden aria-live="polite"></div>
  </div>

  <p class="fc-calc__disclaimer">
    Справочно-информационный характер. Не заменяет консультацию врача и не служит основанием для самостоятельного назначения лечения.
  </p>

  <script>
    (function () {
      var form = document.getElementById('fc-calc-SLUG-form');
      var resultEl = document.getElementById('fc-calc-SLUG-result');
      var exampleInput = document.getElementById('fc-calc-SLUG-example');
      var exampleError = document.getElementById('fc-calc-SLUG-example-error');

      function parsePositive(value) {
        var n = parseFloat(String(value).replace(',', '.'));
        return Number.isFinite(n) && n >= 0 ? n : null;
      }

      function setError(el, message) {
        el.textContent = message || '';
      }

      /** Дублирует calc.js — для html_code на сайте (без import). */
      function calculate(input) {
        var example = input.example;
        return { value: example, interpretation: 'TODO' };
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        setError(exampleError, '');
        resultEl.hidden = true;

        var example = parsePositive(exampleInput.value);
        if (example === null) {
          setError(exampleError, 'Введите корректное неотрицательное число');
          return;
        }

        var out = calculate({ example: example });
        resultEl.innerHTML =
          '<strong>' + out.value + '</strong><br><span class="fc-calc__hint">' + out.interpretation + '</span>';
        resultEl.hidden = false;
      });
    })();
  </script>
</div>
