<!--
  Фрагмент «Примечания» — копировать в index.html без изменений (кроме SLUG в id).
  Заголовок «Примечания» (.fc-calc__notes-title) у всех калькуляторов один.
  Редактировать только содержимое .fc-calc__notes-body.
-->
<details class="fc-calc__notes">
  <summary class="fc-calc__notes-summary">
    <span class="fc-calc__notes-title">Примечания</span>
    <span class="fc-calc__notes-chevron" aria-hidden="true"></span>
  </summary>
  <div class="fc-calc__notes-body" id="fc-calc-SLUG-notes">
    <!-- документация калькулятора -->
    <p class="fc-calc__hint">Калькулятор для медицинских специалистов. Не заменяет клиническое решение врача.</p>
  </div>
</details>
