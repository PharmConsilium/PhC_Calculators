<!-- Секция формы: копировать в fc-calc__body → form. Эталон: hydro-balance -->
<div class="fc-calc__panel-section">
  <div class="fc-calc__panel">
    <h3 class="fc-calc__panel-heading">Название секции</h3>
    <div class="fc-calc__field">
      <label for="fc-calc-SLUG-example">Подпись поля</label>
      <input type="number" id="fc-calc-SLUG-example" name="example" inputmode="decimal" min="0" step="any" />
      <span class="fc-calc__error" id="fc-calc-SLUG-example-error" role="alert"></span>
    </div>
  </div>
</div>
